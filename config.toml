# The URL the site will be built for.
base_url = "https://kyleparkercunningham.com"

# The site title and description; used in feeds by default.
title = "The art of Kyle Parker Cunningham"
description = "Artist portfolio featuring painting, printmaking, and cinema"

# The default language; used in feeds.
default_language = "en"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Generate an RSS feed for the site (built-in rss.xml template) at /rss.xml.
generate_feeds = true
feed_filenames = ["rss.xml"]

# The taxonomies to be rendered for the site and their configuration.
# `topics` belongs to the notes section; `tags` to the oeuvre. They are kept
# separate on purpose — a note's topic and a work's tag are different vocabularies.
# Oeuvre tags are generated: see scripts/tagging/ and docs/tagging-proposal.md.
# Never hand-edit a [taxonomies] block on a work page; it gets overwritten.
taxonomies = [
  {name = "topics", feed = true},
  {name = "tags", feed = true},
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
# highlight_code = false

[extra]
# Put all your custom variables here
author = "Kyle Parker Cunningham"
email = "analogkyle@gmail.com"
# Fallback social-share image (path relative to content/) for pages that have
# no co-located photo of their own — e.g. the homepage and section indexes.
og_default_image = "oeuvre/painting/2024/the-river-in-the-sky/the-river-in-the-sky.jpg"
