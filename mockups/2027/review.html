<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The 2027 review</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Fraunces:opsz,wght@9..144,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root { --paper: #efece4; --ink: #1d2024; --dim: #5d625f; --rule: #c9c4b6; --mark: #2f4cdd; --code: #e3dfd3; }
@media (prefers-color-scheme: dark) { :root { --paper: #15171a; --ink: #ebe7dc; --dim: #a19f97; --rule: #3a3d40; --mark: #8ea0ff; --code: #24272b; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 "Newsreader", Georgia, serif; }
main { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 2.5rem 6rem; }
nav { font: 400 0.75rem/1 "JetBrains Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
a { color: var(--mark); }
a:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); margin: 1.5rem 0 1rem; }
h2 { font-size: 1.7rem; margin: 3rem 0 1rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
p, li { overflow-wrap: anywhere; }
li { margin-block: 0.45rem; }
em { color: var(--dim); }
code { font: 0.85em "JetBrains Mono", monospace; background: var(--code); padding: 0.05em 0.3em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.95rem; min-width: 32rem; }
th, td { text-align: left; vertical-align: top; padding: 0.55rem 0.7rem 0.55rem 0; border-bottom: 1px solid var(--rule); }
th { font: 400 0.72rem/1.3 "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
</style>
</head>
<body>
<main>
  <nav><a href="index.html">← Sketchbook</a></nav>
  <article id="doc"><p>Loading the review…</p></article>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
fetch("review.md").then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    const doc = document.getElementById("doc");
    doc.innerHTML = marked.parse(md);
    doc.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
  })
  .catch(() => { document.getElementById("doc").innerHTML = "<p>The review didn't load. It is <code>docs/2027-review.md</code> in the site repository.</p>"; });
</script>
</body>
</html>
