# On every push this script is executed
on: push
name: Build and deploy GH Pages
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Update recently edited list
        run: |
          python3 scripts/update_recently_edited.py
          python3 scripts/generate_site_index.py
      - name: build_and_deploy
        # Pinned deliberately: @master floats with Zola releases, and 0.23
        # rewrote the template engine (Tera v2), which this site's templates
        # predate — `is ending_with("x")` now needs `pat=`, and the concat,
        # filter and slice filters are gone. v0.22.1 is the last version that
        # built green. See TODO.md §2; unpin once the templates are migrated.
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          # Target branch
          PAGES_BRANCH: gh-pages
          # Use the automatic token for same-repo publishing
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
